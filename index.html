<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rail Booking Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI";
        }

        body {
            min-height: 100vh;
            background: #0F172A;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 80px;
            color: #E5E7EB;
        }

        /* 💎 Card */
        .card {
            width: 360px;
            padding: 28px;
            border-radius: 14px;
            background: #111827;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Title */
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #22C55E;
        }

        /* Status */
        .status {
            background: #1F2937;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }

        /* Input */
        .input-box {
            position: relative;
        }

        input {
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            border: 1px solid #374151;
            background: #0F172A;
            color: #E5E7EB;
            cursor: pointer;
        }

        /* 📅 Calendar */
        .calendar {
            position: absolute;
            top: 50px;
            width: 100%;
            background: #1F2937;
            border-radius: 10px;
            padding: 10px;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 10;
        }

        .calendar.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .cal-header button {
            background: none;
            border: none;
            color: #22C55E;
            font-size: 16px;
            cursor: pointer;
        }

        /* Days */
        .days,
        .dates {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 13px;
        }

        .days div {
            color: #9CA3AF;
            margin-bottom: 5px;
        }

        .dates div {
            padding: 8px;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
        }

        .dates div:hover {
            background: #22C55E;
            color: black;
        }

        .disabled {
            color: #555;
            pointer-events: none;
        }

        .today {
            border: 1px solid #22C55E;
        }

        .selected {
            background: #22C55E;
            color: black;
        }

        /* Button */
        button.main {
            width: 100%;
            padding: 11px;
            border-radius: 6px;
            border: none;
            background: linear-gradient(135deg, #22C55E, #14B8A6);
            color: white;
            margin-top: 10px;
            cursor: pointer;
        }

        /* Alert */
        .alert {
            margin-top: 10px;
            text-align: center;
        }

        .rush {
            color: #f87171;
        }

        .normal {
            color: #9CA3AF;
        }

        /* Result */
        .result {
            margin-top: 15px;
            background: #1F2937;
            padding: 10px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .extra {
            margin-top: 5px;
            color: #22C55E;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Rail Booking Tracker</h2>

        <div class="status" id="todayStatus"></div>

        <div class="input-box">
            <input type="text" id="travelDate" placeholder="Select travel date" readonly onclick="toggleCal()">

            <div class="calendar" id="calendar">
                <div class="cal-header">
                    <button onclick="prevMonth()">‹</button>
                    <div id="monthYear"></div>
                    <button onclick="nextMonth()">›</button>
                </div>

                <div class="days">
                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>
                </div>

                <div class="dates" id="dates"></div>
            </div>
        </div>

        <button class="main" onclick="calculate()">Check Booking</button>

        <div class="alert" id="alertText"></div>

        <div class="result" id="resultBox">
            <div id="dateText"></div>
            <div class="extra" id="extraInfo"></div>
        </div>
    </div>

    <script>

        let current = new Date();
        let selectedDate = null;

        // 📅 Toggle with animation + auto reset
        function toggleCal() {
            let cal = document.getElementById("calendar");

            if (cal.classList.contains("show")) {
                cal.classList.remove("show");
            } else {
                current = new Date(); // 🎯 auto scroll to current month
                renderCalendar();
                cal.classList.add("show");
            }
        }

        // 📅 Render
        function renderCalendar() {
            let year = current.getFullYear();
            let month = current.getMonth();

            let today = new Date();
            today.setHours(0, 0, 0, 0);

            let maxDate = new Date();
            maxDate.setDate(today.getDate() + 120); // 📅 limit

            let firstDay = new Date(year, month, 1).getDay();
            let lastDate = new Date(year, month + 1, 0).getDate();

            document.getElementById("monthYear").innerText =
                current.toLocaleString("default", { month: "long" }) + " " + year;

            let dates = "";

            for (let i = 0; i < firstDay; i++) dates += "<div></div>";

            for (let d = 1; d <= lastDate; d++) {
                let fullDate = new Date(year, month, d);
                fullDate.setHours(0, 0, 0, 0);

                let classes = "";

                if (fullDate <= today || fullDate > maxDate) classes += "disabled ";
                if (fullDate.getTime() === today.getTime()) classes += "today ";
                if (selectedDate && fullDate.getTime() === selectedDate.getTime()) classes += "selected ";

                dates += `<div class="${classes}" onclick="selectDate(${d})">${d}</div>`;
            }

            document.getElementById("dates").innerHTML = dates;
        }

        // 📅 Select
        function selectDate(day) {
            let d = new Date(current.getFullYear(), current.getMonth(), day);
            selectedDate = d;

            let formatted = d.toLocaleDateString("en-GB", {
                weekday: "long",
                day: "2-digit",
                month: "long",
                year: "numeric"
            });

            document.getElementById("travelDate").value = formatted;
            document.getElementById("calendar").classList.remove("show");

            renderCalendar();
        }

        // Navigation
        function prevMonth() { current.setMonth(current.getMonth() - 1); renderCalendar(); }
        function nextMonth() { current.setMonth(current.getMonth() + 1); renderCalendar(); }

        // 🔥 Status
        function showTodayStatus() {
            let t = new Date();
            let m = new Date();
            m.setDate(t.getDate() + 60);

            document.getElementById("todayStatus").innerHTML =
                t.toLocaleDateString("en-GB", { weekday: "long", day: "2-digit", month: "long", year: "numeric" }) +
                "<br>to<br>" +
                m.toLocaleDateString("en-GB", { weekday: "long", day: "2-digit", month: "long", year: "numeric" }) +
                "<br>⏰ 08:00 AM";
        }
        showTodayStatus();

        // 🔍 Logic
        function calculate() {
            let alertText = document.getElementById("alertText");
            let resultBox = document.getElementById("resultBox");
            let extra = document.getElementById("extraInfo");

            alertText.innerHTML = "";
            resultBox.style.display = "none";

            if (!selectedDate) {
                alertText.innerHTML = "Please select a date";
                return;
            }

            let today = new Date();
            today.setHours(0, 0, 0, 0);

            let travel = new Date(selectedDate);

            let openLimit = new Date();
            openLimit.setDate(today.getDate() + 60);

            if (travel <= openLimit) {
                alertText.innerHTML = "<span class='rush'>🚨 Booking Already Open</span>";

                document.getElementById("dateText").innerHTML =
                    travel.toLocaleDateString("en-GB", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });

                extra.innerHTML = "Book immediately";
                resultBox.style.display = "block";
                return;
            }

            let openDate = new Date(travel);
            openDate.setDate(openDate.getDate() - 60);

            let diff = Math.ceil((openDate - today) / (1000 * 60 * 60 * 24));

            alertText.innerHTML = "<span class='normal'>Booking not open yet</span>";

            document.getElementById("dateText").innerHTML =
                openDate.toLocaleDateString("en-GB", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });

            extra.innerHTML = "Opens in " + diff + " days";

            resultBox.style.display = "block";
        }

    </script>

</body>

</html>
